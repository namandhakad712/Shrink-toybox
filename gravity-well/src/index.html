<body style=margin:0;overflow:hidden;background:#000>
<canvas id=c></canvas>
<span style=position:fixed;top:10px;left:12px;color:#fff;font:12px monospace;opacity:.7>hold to feed stars - mass <b id=score>0</b></span>
<script>
let ctx = c.getContext('2d')
let holeX = innerWidth / 2
let holeY = innerHeight / 2
let stars = []
let eaten = 0
let flash = 0
let time = 0
let mouseX = holeX
let mouseY = 0
let holding = false
let sound = null

function fit() {
  c.width = innerWidth
  c.height = innerHeight
  holeX = c.width / 2
  holeY = c.height / 2
}
fit()
onresize = fit

onpointermove = e => {
  mouseX = e.clientX
  mouseY = e.clientY
}
onpointerdown = e => {
  mouseX = e.clientX
  mouseY = e.clientY
  holding = true
  if (!sound) sound = new AudioContext()
}
onpointerup = () => holding = false

function gulp(high, low) {
  let osc = sound.createOscillator()
  let gain = sound.createGain()
  let now = sound.currentTime
  osc.connect(gain)
  gain.connect(sound.destination)
  osc.frequency.setValueAtTime(high, now)
  osc.frequency.exponentialRampToValueAtTime(low, now + .25)
  gain.gain.setValueAtTime(.15, now)
  gain.gain.exponentialRampToValueAtTime(.001, now + .25)
  osc.start(now)
  osc.stop(now + .26)
}

function tick() {
  time++
  ctx.fillStyle = 'rgba(0,0,0,.28)'
  ctx.fillRect(0, 0, c.width, c.height)

  let drops = holding ? 3 : 1
  for (let k = 0; k < drops; k++) {
    stars.push([
      holding ? mouseX : Math.random() * c.width,
      holding ? mouseY : 0,
      (Math.random() - .5) * 4,
      Math.random() * 2
    ])
  }

  flash *= .94
  ctx.fillStyle = 'hsl(' + (time * 2 % 360) + ',100%,60%)'
  ctx.beginPath()
  ctx.arc(holeX, holeY, 26 + flash * 22, 0, 7)
  ctx.fill()

  for (let i = stars.length - 1; i >= 0; i--) {
    let s = stars[i]
    let dx = holeX - s[0]
    let dy = holeY - s[1]
    let d = Math.hypot(dx, dy) + 1
    let pull = 2600 / (d * d + 400)
    s[2] += dx / d * pull
    s[3] += dy / d * pull
    s[2] *= .985
    s[3] *= .985
    s[0] += s[2]
    s[1] += s[3]
    if (d < 16) {
      stars.splice(i, 1)
      eaten++
      flash = 1
      score.textContent = eaten
      if (sound) gulp(700 + Math.random() * 300, 50)
      continue
    }
    if (s[0] < -50 || s[0] > c.width + 50 || s[1] < -50 || s[1] > c.height + 50) {
      stars.splice(i, 1)
      continue
    }
    ctx.fillStyle = '#fff'
    ctx.fillRect(s[0], s[1], 2, 2)
  }

  ctx.fillStyle = '#000'
  ctx.beginPath()
  ctx.arc(holeX, holeY, 18, 0, 7)
  ctx.fill()
  ctx.strokeStyle = '#fff'
  ctx.beginPath()
  ctx.arc(holeX, holeY, 18, 0, 7)
  ctx.stroke()
  requestAnimationFrame(tick)
}
tick()
</script>
