<body style=margin:0;overflow:hidden;background:#000>
<canvas id=c></canvas>
<span style=position:fixed;top:10px;left:12px;color:#fff;font:12px monospace;opacity:.7>steer with mouse - hold = boost - <b id=score>0</b> ly</span>
<script>
let ctx = c.getContext('2d')
let rings = 30
let spokes = 10
let tunnel = []
for (let i = 0; i < rings; i++) {
  tunnel.push([i / rings, Math.random() * 6.28])
}
let steerX = 0
let steerY = 0
let boosting = false
let speed = 0
let dist = 0
let time = 0
let sound = null
let engine = null

function fit() {
  c.width = innerWidth
  c.height = innerHeight
}
fit()
onresize = fit

onpointermove = e => {
  steerX = e.clientX / c.width - .5
  steerY = e.clientY / c.height - .5
}
onpointerdown = () => {
  boosting = true
  if (!sound) {
    sound = new AudioContext()
    engine = sound.createOscillator()
    let gain = sound.createGain()
    engine.type = 'sawtooth'
    engine.frequency.value = 60
    gain.gain.value = .04
    engine.connect(gain)
    gain.connect(sound.destination)
    engine.start()
  }
}
onpointerup = () => boosting = false

let p1 = [0, 0]
let p2 = [0, 0]
function spot(spin, n, depth, out) {
  let a = spin + n * 6.283 / spokes + time * .02
  let s = 1 / (depth + .15)
  out[0] = c.width / 2 + (Math.cos(a) * 220 - steerX * 300 * depth) * s
  out[1] = c.height / 2 + (Math.sin(a) * 220 - steerY * 300 * depth) * s
}

function tick() {
  time++
  speed += ((boosting ? .05 : .012) - speed) * .05
  dist += speed * 10
  score.textContent = Math.floor(dist)
  if (engine) engine.frequency.setTargetAtTime(50 + speed * 4000, sound.currentTime, .05)
  ctx.fillStyle = 'rgba(0,0,10,.35)'
  ctx.fillRect(0, 0, c.width, c.height)
  for (let i = 0; i < rings; i++) {
    let r = tunnel[i]
    r[0] -= speed
    if (r[0] <= 0) {
      r[0] += 1
      r[1] = Math.random() * 6.28
    }
    ctx.strokeStyle = 'hsl(' + ((time * 3 + i * 9) % 360) + ',100%,60%)'
    for (let k = 0; k < spokes; k++) {
      spot(r[1], k, r[0], p1)
      let next = tunnel[(i + 1) % rings]
      spot(next[1], k, next[0], p2)
      ctx.beginPath()
      ctx.moveTo(p1[0], p1[1])
      ctx.lineTo(p2[0], p2[1])
      ctx.stroke()
    }
  }
  ctx.fillStyle = '#fff'
  ctx.fillRect(c.width / 2 - 2, c.height / 2 - 2, 4, 4)
  requestAnimationFrame(tick)
}
tick()
</script>
